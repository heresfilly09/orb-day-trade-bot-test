# ORB Day Trading Bot Configuration
# ES Futures — Opening Range Breakout (first two 15-min candles)

strategy:
  orb_start: "09:30"
  orb_end: "10:00"
  orb_candle_minutes: 15
  breakout_trigger: "close"       # "close" or "wick"
  breakout_buffer_ticks: 0        # extra ticks beyond range to confirm (0 = none)
  max_range_size: 0               # skip day if range > this (0 = off)
  min_range_size: 0               # skip day if range < this (0 = off)
  wait_for_retest: false

risk:
  stop_loss_buffer: 0.0           # extra pts beyond opposite end (0 = exact)
  profit_target_rr: 2.0           # reward:risk ratio
  fixed_profit_target: 0          # fixed pts target (overrides RR, 0 = off)
  max_daily_loss: 20.0
  position_size: 1
  max_trades_per_day: 2
  use_trailing_stop: false
  trailing_stop_distance: 3.0

trading:
  session_end: "15:45"
  paper_trade: true
  tick_size: 0.25
  tick_value: 12.50
  point_value: 50.0

tradovate:
  demo: true

logging:
  level: "INFO"
  trade_journal: "orb_trades.csv"
  log_file: "orb_bot.log"
