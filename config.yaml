# ORB Day Trading Bot Configuration
# ES Futures — Opening Range Breakout (first two 15-min candles)

strategy:
  orb_start: "09:30"
  orb_end: "10:00"
  orb_candle_minutes: 15
  breakout_trigger: "close"       # "close" or "wick"
  breakout_buffer_pts: 1.0        # price must close this far beyond range (0 = any close)
  max_range_size: 15              # skip day if range > this (0 = off)
  min_range_size: 5               # skip day if range < this (0 = off)
  wait_for_retest: false
  breakout_end: "11:00"           # stop taking new entries after this time

  # Filters
  use_ema_filter: true
  ema_length: 50
  use_vwap_filter: true
  use_rsi_filter: true
  rsi_length: 14
  rsi_overbought: 70
  rsi_oversold: 30
  use_volume_filter: true
  volume_ma_length: 20
  volume_multiplier: 1.0

risk:
  stop_loss_buffer: 0.5           # extra pts beyond opposite end
  profit_target_rr: 1.0           # reward:risk ratio
  fixed_profit_target: 0          # fixed pts target (overrides RR, 0 = off)
  max_daily_loss: 20.0
  position_size: 1
  max_trades_per_day: 1
  use_breakeven: true             # move SL to entry at 1R profit
  use_trailing_stop: false
  trailing_stop_distance: 3.0

trading:
  session_end: "15:45"
  paper_trade: true
  tick_size: 0.25
  tick_value: 12.50
  point_value: 50.0

tradovate:
  demo: true

logging:
  level: "INFO"
  trade_journal: "orb_trades.csv"
  log_file: "orb_bot.log"
